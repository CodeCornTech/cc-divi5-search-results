name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  static-and-build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runtime versions
        run: |
          php -v
          composer --version
          node --version
          npm --version

      - name: Composer validate
        run: composer validate --strict

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: npm install from lock
        run: npm ci

      - name: Search engine contract
        run: npm run check

      - name: Build Divi bundle
        run: npm run build

      - name: Deployment shell syntax
        run: |
          bash -n bin/cc-deploy-vm
          bash -n bin/cc-deploy-barbagia-vm
          bash -n bin/cc-deploy-local

      - name: PHP lint
        run: |
          find . \
            -path ./vendor -prune -o \
            -path ./node_modules -prune -o \
            -name '*.php' -print0 \
            | xargs -0 -n1 php -l
